[DMX Inventory - Collect]
description = Collects DMX inventory. Enable after storing the service-account token (see README). On a search head cluster the captain runs this on one member per interval.
search = | dmxcollect
enableSched = 0
cron_schedule = */15 * * * *
schedule_window = 5
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatchAs = owner

[DMX Inventory - Change alert]
description = Fires when a pipeline, destination or dataset is added, modified or removed. Add an alert action (email, Slack, etc.) before enabling.
search = `dmx_index` sourcetype=dmx:change initial_load!=true _index_earliest=-15m@m _index_latest=@m \
| table _time object_type change_type name object_id changed_fields collection_id
enableSched = 0
cron_schedule = 5-59/15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1

[DMX Inventory - Stale or failed collection]
description = Fires when no successful collection happened in the last hour, or a collection failed.
search = `dmx_index` sourcetype=dmx:collector \
| stats count(eval(status="success")) as successful count(eval(status="failed" OR status="partial")) as failed latest(status) as last_status max(_time) as last_run \
| where successful=0 OR failed>0 \
| eval last_run=strftime(last_run, "%F %T %Z")
enableSched = 0
cron_schedule = 20 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1

[DMX Inventory - Schema drift]
description = Fires when the DMX API starts returning new top-level fields or stops returning ones it used to. Check the collector still parses objects correctly.
search = `dmx_index` sourcetype=dmx:collector \
| where match(_raw, "\"(new|missing)_keys\":\[\"") \
| table _time collection_id _raw
enableSched = 0
cron_schedule = 25 */6 * * *
dispatch.earliest_time = -6h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1

# Defaults for the DMX Inventory collector. Override in local/dmx_inventory.conf.
# The [api] values are UNCONFIRMED (taken from the handover); verify them in Phase 0.

[api]
base_path = /services/v2/dmx
pipelines_path = pipelines
destinations_path = destinations
datasets_path = datasets
offset_param = offset
count_param = count
page_size = 100
max_pages = 500
timeout_seconds = 60

[collector]
index = dmx_inventory
credential_realm = dmx_inventory
credential_name = dmx_service_account
allow_session_key_fallback = true
lock_ttl_seconds = 600
max_batch_bytes = 1000000

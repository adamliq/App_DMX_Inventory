[dmxcollect-command]
syntax = dmxcollect (types=<string>)? (dry_run=<bool>)?
shortdesc = Collect Ingest Processor (DMX) pipelines, destinations and datasets.
description = Fetches DMX inventory from the local management port, writes snapshot, change and run-health events to the dmx_inventory index, and updates the current-state KV store collections. With dry_run=t it only fetches and displays normalized objects.
usage = public
example1 = | dmxcollect dry_run=t
comment1 = Preview what would be collected without writing anything.
example2 = | dmxcollect types="pipelines"
comment2 = Collect pipelines only.
